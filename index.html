<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Mis Medicamentos</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0B3D3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Medicamentos">
<style>
  :root{
    --teal-900:#0B3D3A;
    --teal-700:#136F63;
    --teal-500:#1F9E8E;
    --mint-100:#EAF6F3;
    --paper:#FBFAF7;
    --ink:#1C2321;
    --ink-soft:#5B6664;
    --amber:#E0A458;
    --line:#DCE7E4;
    --danger:#C1503E;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:90px;position:relative}

  header{
    background:linear-gradient(160deg,var(--teal-900),var(--teal-700));
    color:#fff;padding:28px 22px 34px;position:relative;overflow:hidden;
  }
  header::after{
    content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;
    border-radius:50%;background:rgba(255,255,255,0.06);
  }
  header h1{margin:0;font-size:22px;letter-spacing:0.2px;display:flex;align-items:center;gap:9px}
  header p{margin:6px 0 0;font-size:13px;color:#CFE9E4;font-weight:500}
  .pill-icon{width:22px;height:22px;flex-shrink:0}

  .next-card{
    margin:-20px 18px 0;background:#fff;border-radius:16px;padding:16px 18px;
    box-shadow:0 8px 24px rgba(11,61,58,0.14);position:relative;z-index:2;
  }
  .next-card .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:0.6px;color:var(--teal-500);font-weight:700}
  .next-card .med-name{font-size:19px;font-weight:700;margin:4px 0 2px;color:var(--teal-900)}
  .next-card .med-time{font-size:14px;color:var(--ink-soft)}
  .next-card .none{font-size:14px;color:var(--ink-soft);padding:6px 0}

  main{padding:22px 18px 0}
  .section-title{font-size:13px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.5px;margin:0 0 10px}

  .med-card{
    background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;margin-bottom:12px;
  }
  .med-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .med-card-name{font-size:16px;font-weight:700;color:var(--ink)}
  .med-card-dose{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
  .med-card-actions{display:flex;gap:4px;flex-shrink:0}
  .med-edit{background:none;border:none;font-size:15px;cursor:pointer;padding:2px 4px;line-height:1}
  .med-del{background:none;border:none;color:#B7BFBD;font-size:18px;cursor:pointer;padding:2px 4px;line-height:1}
  .times-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .time-chip{
    display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;
    padding:7px 12px 7px 10px;font-size:13px;font-weight:600;background:var(--mint-100);color:var(--teal-900);
  }
  .time-chip.tomado{background:var(--teal-500);color:#fff;border-color:var(--teal-500)}
  .time-chip.atrasado{background:#FBEDE7;color:var(--danger);border-color:#F0CFC4}
  .chip-check{
    width:18px;height:18px;border-radius:50%;border:2px solid currentColor;
    display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;background:none;cursor:pointer;color:inherit;
  }
  .time-chip.tomado .chip-check{background:#fff;color:var(--teal-500);border-color:#fff}

  .empty-state{
    text-align:center;padding:40px 20px;color:var(--ink-soft);font-size:14px;
  }
  .empty-state .big{font-size:34px;margin-bottom:8px}

  .fab{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    max-width:480px;width:calc(100% - 36px);
    background:var(--teal-700);color:#fff;border:none;border-radius:14px;
    padding:15px;font-size:15px;font-weight:700;cursor:pointer;
    box-shadow:0 10px 24px rgba(19,111,99,0.35);
  }

  .sheet-overlay{
    position:fixed;inset:0;background:rgba(11,20,19,0.45);display:none;
    align-items:flex-end;justify-content:center;z-index:20;
  }
  .sheet-overlay.abierto{display:flex}
  .sheet{
    background:var(--paper);width:100%;max-width:480px;border-radius:20px 20px 0 0;
    padding:22px 20px 26px;max-height:85vh;overflow-y:auto;
  }
  .sheet h2{margin:0 0 16px;font-size:18px;color:var(--teal-900)}
  .campo{margin-bottom:14px}
  .campo label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px}
  .campo input[type=text]{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;color:var(--ink);background:#fff;
  }
  .horas-lista{display:flex;flex-direction:column;gap:8px}
  .hora-fila{display:flex;gap:8px;align-items:center}
  .hora-fila input[type=time]{
    flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;color:var(--ink);
  }
  .hora-quitar{background:none;border:none;color:#B7BFBD;font-size:18px;cursor:pointer;padding:4px 8px}
  .btn-agregar-hora{
    margin-top:8px;background:var(--mint-100);color:var(--teal-700);border:none;border-radius:9px;
    padding:9px;font-size:13px;font-weight:700;cursor:pointer;width:100%;
  }
  .sheet-botones{display:flex;gap:10px;margin-top:20px}
  .btn-cancelar{flex:1;background:#fff;border:1px solid var(--line);border-radius:11px;padding:13px;font-size:14px;font-weight:700;color:var(--ink-soft);cursor:pointer}
  .btn-guardar{flex:2;background:var(--teal-700);border:none;border-radius:11px;padding:13px;font-size:14px;font-weight:700;color:#fff;cursor:pointer}

  .toast{
    position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-60px);
    background:var(--teal-900);color:#fff;padding:12px 18px;border-radius:11px;font-size:13.5px;font-weight:600;
    box-shadow:0 8px 20px rgba(0,0,0,0.25);z-index:50;transition:transform .25s ease;max-width:90%;text-align:center;
  }
  .toast.mostrar{transform:translateX(-50%) translateY(0)}

  .permiso-box{
    margin:16px 18px 0;background:#FFF8EC;border:1px solid #F0DDB0;border-radius:12px;
    padding:12px 14px;font-size:12.5px;color:#7A5B22;display:flex;align-items:center;gap:10px;
  }
  .permiso-box button{
    background:var(--amber);border:none;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:700;color:#fff;cursor:pointer;flex-shrink:0;
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <h1>
      <svg class="pill-icon" viewBox="0 0 24 24" fill="none"><path d="M4.5 19.5L14 10a4.24 4.24 0 116 6l-9.5 9.5a4.24 4.24 0 01-6-6z" stroke="#fff" stroke-width="1.8"/><path d="M9 15l4-4" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
      Mis Medicamentos
    </h1>
    <p id="fechaHoy"></p>
  </header>

  <div class="next-card" id="nextCard">
    <div class="eyebrow">Próxima toma</div>
    <div class="none">Agrega un medicamento para empezar</div>
  </div>

  <div class="permiso-box" id="permisoBox" style="display:none">
    <span>Activa las notificaciones para que te avise a la hora exacta (solo mientras esta pantalla esté abierta).</span>
    <button id="btnPermiso">Activar</button>
  </div>

  <main>
    <div class="section-title">Hoy</div>
    <div id="listaMeds"></div>
  </main>

  <button class="fab" id="btnAbrirForm">+ Agregar medicamento</button>
</div>

<div class="sheet-overlay" id="overlay">
  <div class="sheet">
    <h2 id="sheetTitulo">Nuevo medicamento</h2>
    <div class="campo">
      <label>Nombre</label>
      <input type="text" id="inputNombre" placeholder="Ej. Losartán">
    </div>
    <div class="campo">
      <label>Dosis (opcional)</label>
      <input type="text" id="inputDosis" placeholder="Ej. 50 mg, 1 tableta">
    </div>
    <div class="campo">
      <label>Horarios</label>
      <div class="horas-lista" id="horasLista"></div>
      <button class="btn-agregar-hora" id="btnAgregarHora">+ Agregar otro horario</button>
    </div>
    <div class="sheet-botones">
      <button class="btn-cancelar" id="btnCancelar">Cancelar</button>
      <button class="btn-guardar" id="btnGuardar">Guardar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_MEDS = 'mismeds-lista';
const STORAGE_LOG = 'mismeds-registro';
const DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function cargarMeds(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_MEDS)) || []; }catch(e){ return []; }
}
function guardarMeds(meds){
  try{ localStorage.setItem(STORAGE_MEDS, JSON.stringify(meds)); }catch(e){}
}
function cargarLog(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_LOG)) || {}; }catch(e){ return {}; }
}
function guardarLog(log){
  try{ localStorage.setItem(STORAGE_LOG, JSON.stringify(log)); }catch(e){}
}
function hoyKey(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function horaAhoraStr(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

let meds = cargarMeds();
let log = cargarLog();

function marcaKey(medId, hora){
  return hoyKey()+'|'+medId+'|'+hora;
}
function estaTomado(medId, hora){
  return !!log[marcaKey(medId, hora)];
}
function toggleTomado(medId, hora){
  const k = marcaKey(medId, hora);
  if (log[k]) delete log[k];
  else log[k] = true;
  guardarLog(log);
  render();
}

function renderFecha(){
  const d = new Date();
  document.getElementById('fechaHoy').textContent = DIAS[d.getDay()]+', '+d.getDate()+' de '+MESES[d.getMonth()];
}

function renderNextCard(){
  const ahora = horaAhoraStr();
  let candidatos = [];
  meds.forEach(m=>{
    m.horas.forEach(h=>{
      if (!estaTomado(m.id, h)) candidatos.push({nombre:m.nombre, dosis:m.dosis, hora:h});
    });
  });
  candidatos.sort((a,b)=> a.hora.localeCompare(b.hora));
  let futuros = candidatos.filter(c=> c.hora >= ahora);
  const el = document.getElementById('nextCard');
  const base = futuros.length ? futuros : candidatos;
  if (base.length === 0){
    el.innerHTML = '<div class="eyebrow">Próxima toma</div><div class="none">'+(meds.length? 'Ya tomaste todo lo de hoy 🎉' : 'Agrega un medicamento para empezar')+'</div>';
    return;
  }
  // Todos los que coinciden con la hora mas proxima, no solo el primero
  const horaProxima = base[0].hora;
  const empatados = base.filter(c=> c.hora === horaProxima);
  el.innerHTML = '<div class="eyebrow">Próxima toma · '+horaProxima+'</div>'+
    empatados.map(c=>
      '<div class="med-name" style="margin-top:6px">'+c.nombre+'</div>'+
      (c.dosis? '<div class="med-time">'+c.dosis+'</div>' : '')
    ).join('');
}

function renderLista(){
  const cont = document.getElementById('listaMeds');
  if (meds.length === 0){
    cont.innerHTML = '<div class="empty-state"><div class="big">💊</div>Todavía no has agregado ningún medicamento.</div>';
    return;
  }
  const ahora = horaAhoraStr();
  cont.innerHTML = meds.map(m=>{
    const chips = m.horas.slice().sort().map(h=>{
      const tomado = estaTomado(m.id, h);
      const atrasado = !tomado && h < ahora;
      const clase = tomado ? 'tomado' : (atrasado ? 'atrasado' : '');
      return '<div class="time-chip '+clase+'">'+
        '<button class="chip-check" onclick="toggleTomado(\''+m.id+'\',\''+h+'\')">'+(tomado?'✓':'')+'</button>'+
        h+'</div>';
    }).join('');
    return '<div class="med-card">'+
      '<div class="med-card-top">'+
        '<div><div class="med-card-name">'+m.nombre+'</div>'+(m.dosis?'<div class="med-card-dose">'+m.dosis+'</div>':'')+'</div>'+
        '<div class="med-card-actions">'+
          '<button class="med-edit" onclick="abrirForm(\''+m.id+'\')">✏️</button>'+
          '<button class="med-del" onclick="borrarMed(\''+m.id+'\')">🗑</button>'+
        '</div>'+
      '</div>'+
      '<div class="times-row">'+chips+'</div>'+
    '</div>';
  }).join('');
}

function render(){
  renderFecha();
  renderNextCard();
  renderLista();
}

function borrarMed(id){
  if (!window.confirm('¿Eliminar este medicamento de la lista?')) return;
  meds = meds.filter(m=> m.id !== id);
  guardarMeds(meds);
  render();
}

// ---------- Formulario ----------
const overlay = document.getElementById('overlay');
const horasLista = document.getElementById('horasLista');

function nuevaFilaHora(valor){
  const fila = document.createElement('div');
  fila.className = 'hora-fila';
  fila.innerHTML = '<input type="time" value="'+(valor||'08:00')+'">'+
    '<button class="hora-quitar" type="button">✕</button>';
  fila.querySelector('.hora-quitar').addEventListener('click', ()=>{
    if (horasLista.children.length > 1) fila.remove();
  });
  horasLista.appendChild(fila);
}

function abrirForm(idEditar){
  medEditandoId = idEditar || null;
  const sheetTitulo = document.getElementById('sheetTitulo');
  horasLista.innerHTML = '';
  if (medEditandoId){
    const m = meds.find(x=> x.id === medEditandoId);
    sheetTitulo.textContent = 'Editar medicamento';
    document.getElementById('inputNombre').value = m.nombre;
    document.getElementById('inputDosis').value = m.dosis || '';
    m.horas.slice().sort().forEach(h=> nuevaFilaHora(h));
  } else {
    sheetTitulo.textContent = 'Nuevo medicamento';
    document.getElementById('inputNombre').value = '';
    document.getElementById('inputDosis').value = '';
    nuevaFilaHora('08:00');
  }
  overlay.classList.add('abierto');
}
function cerrarForm(){
  overlay.classList.remove('abierto');
  medEditandoId = null;
}

let medEditandoId = null;

document.getElementById('btnAbrirForm').addEventListener('click', ()=> abrirForm());
document.getElementById('btnCancelar').addEventListener('click', cerrarForm);
document.getElementById('btnAgregarHora').addEventListener('click', ()=> nuevaFilaHora());
overlay.addEventListener('click', (e)=>{ if (e.target === overlay) cerrarForm(); });

document.getElementById('btnGuardar').addEventListener('click', ()=>{
  const nombre = document.getElementById('inputNombre').value.trim();
  const dosis = document.getElementById('inputDosis').value.trim();
  const horas = Array.from(horasLista.querySelectorAll('input[type=time]')).map(i=>i.value).filter(Boolean);
  if (!nombre){
    mostrarToast('Escribe el nombre del medicamento');
    return;
  }
  if (horas.length === 0){
    mostrarToast('Agrega al menos un horario');
    return;
  }
  if (medEditandoId){
    const m = meds.find(x=> x.id === medEditandoId);
    m.nombre = nombre;
    m.dosis = dosis;
    m.horas = horas;
  } else {
    meds.push({
      id: 'med_'+Date.now(),
      nombre, dosis, horas
    });
  }
  guardarMeds(meds);
  cerrarForm();
  render();
  mostrarToast(medEditandoId ? 'Medicamento actualizado' : 'Medicamento agregado');
});

// ---------- Toast ----------
let toastTimer = null;
function mostrarToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('mostrar');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('mostrar'), 3200);
}

// ---------- Notificaciones ----------
const permisoBox = document.getElementById('permisoBox');
function actualizarPermisoBox(){
  if ('Notification' in window && Notification.permission === 'default'){
    permisoBox.style.display = 'flex';
  } else {
    permisoBox.style.display = 'none';
  }
}
document.getElementById('btnPermiso').addEventListener('click', ()=>{
  if ('Notification' in window){
    Notification.requestPermission().then(actualizarPermisoBox);
  }
});

let ultimoChequeoMinuto = '';
function chequearRecordatorios(){
  const ahora = horaAhoraStr();
  if (ahora === ultimoChequeoMinuto) return;
  ultimoChequeoMinuto = ahora;

  meds.forEach(m=>{
    m.horas.forEach(h=>{
      if (h === ahora && !estaTomado(m.id, h)){
        dispararAlerta(m, h);
      }
    });
  });
}

function dispararAlerta(med, hora){
  try{
    const audio = document.getElementById('sonidoAlerta');
    audio.currentTime = 0;
    audio.play().catch(()=>{});
  }catch(e){}

  if ('Notification' in window && Notification.permission === 'granted'){
    try{
      new Notification('Hora de tu medicamento', {
        body: med.nombre + (med.dosis? ' · '+med.dosis : '') + ' — '+hora,
      });
    }catch(e){}
  }
  mostrarToast('⏰ Es hora de tomar: '+med.nombre);
  render();
}

setInterval(chequearRecordatorios, 15000);

// ---------- Inicio ----------
actualizarPermisoBox();
render();
</script>
